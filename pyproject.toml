[project]
name = "mapr1"
version = "0.1.0"
description = "MapR1 — AI-powered imagination and world simulation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Simulation layer
    "networkx>=3.3",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.13.0",
    "simpy>=4.1.1",
    # LLM / AI
    "openai>=1.30.0",
    "httpx>=0.27.0",
    # PyTorch with CUDA 11.8 (wheel pulled from PyTorch index via [tool.uv])
    "torch==2.3.1+cu118",
    "torchvision==0.18.1+cu118",
    "torchaudio==2.3.1+cu118",
    # Vector memory — transformers pinned to last version supporting PyTorch 2.3.x
    "transformers>=4.41.0,<4.45.0",
    # Vector memory
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    # Utilities
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "tenacity>=8.3.0",
    "orjson>=3.10.0",
    "instructor>=1.6.3",
    "pytest>=9.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "httpx>=0.27.0",
]
viz = [
    "plotly>=5.22.0",
    "matplotlib>=3.9.0",
]
diffusion = [
    "diffusers>=0.29.0",
    "transformers>=4.41.0",
    "accelerate>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ── PyTorch CUDA 11.8: pull wheels from PyTorch's own index ────────────────
[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu118"]
